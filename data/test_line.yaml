# 예시 배선: 본선 고속 구간 + 역 접근 구간 + 역 구내
# 블록 길이는 TVM430 일반값(평탄 구간 약 1500m)을 바탕으로 한 예시

blocks:
  # 본선 고속 구간
  - id: B1
    length: 1500
    next: B2
  - id: B2
    length: 1500
    next: B3
  - id: B3
    length: 1600     # 하구배 구간 가정: 제동거리가 길어져 블록을 길게
    next: B4
  - id: B4
    length: 1500
    next: B5
  - id: B5
    length: 1400     # 상구배 구간 가정
    next: B6
  - id: B6
    length: 1500
    next: B7
  - id: B7
    length: 1500
    next: B8
  - id: B8
    length: 1500
    next: B9
  - id: B9
    length: 1500
    next: B10
  # 역 접근 구간: 표정속도 감소
  - id: B10
    length: 1200
    next: B11
  - id: B11
    length: 1000
    next: B12
  - id: B12
    length: 800
    next: B13
  - id: B13
    length: 600
    next: W1T
  # 역 구내
  - id: W1T          # W1 분기기 구간
    length: 150
    next: B14        # 정위 방향 (W1 normal_next와 같아야 함)
  - id: B14          # 1번선 (통과선)
    length: 400
  - id: W2T          # W2 분기기 구간
    length: 120
    next: B15        # 정위 방향 (W2 normal_next와 같아야 함)
  - id: B15          # 2번선
    length: 400
  - id: B16          # 유치선
    length: 300

switches:
  - id: W1
    block: W1T
    normal_next: B14
    reverse_next: W2T
    direction: REVERSE
  - id: W2
    block: W2T
    normal_next: B15
    reverse_next: B16
    direction: REVERSE
